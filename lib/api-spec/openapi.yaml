  /videos/{id}/file:
    post:
      operationId: uploadVideoFile
      tags: [videos]
      summary: Upload the video binary (OWNER/ADMIN)
      description: Accepts a single multipart "file" field (mp4/webm/mkv/mov). The video moves to PENDING_REVIEW once stored.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Upload stored; video is now PENDING_REVIEW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Missing file or unsupported media type

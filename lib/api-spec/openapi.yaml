openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Heiba private video streaming platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: admin
    description: Administrative operations
  - name: groups
    description: Group and membership operations
  - name: categories
    description: Video category operations
  - name: videos
    description: Video library management
  - name: reviews
    description: Manual video review operations
  - name: library
    description: Member-facing video library
  - name: stream
    description: Secure video streaming
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token in the Authorization header
    cookieAuth:
      type: apiKey
      in: cookie
      name: heiba_session
      description: Session token in an httpOnly cookie
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserRole:
      type: string
      enum: [OWNER, ADMIN, GROUP_MANAGER, MEMBER]
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - isActive
        - createdAt
    SessionInfo:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
          nullable: true
        deviceInfo:
          type: string
          nullable: true
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        current:
          type: boolean
      required:
        - id
        - ipAddress
        - createdAt
        - revoked
        - current
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        deviceId:
          type: string
          maxLength: 128
      required:
        - email
        - password
    AuthResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - user
        - token
    CurrentUserResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/SessionInfo"
      required:
        - user
        - session
    SessionListResult:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
      required:
        - sessions
    UserListResult:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
      required:
        - users
        - total
    CreateUserInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
      required:
        - email
        - password
        - role
    UpdateUserInput:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
    GroupRole:
      type: string
      enum: [manager, member]
    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - ownerId
        - memberCount
        - createdAt
        - updatedAt
    GroupListResult:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        total:
          type: integer
      required:
        - groups
        - total
    CreateGroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
      required:
        - name
    UpdateGroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
    GroupMember:
      type: object
      properties:
        userId:
          type: integer
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        roleInGroup:
          $ref: "#/components/schemas/GroupRole"
        joinedAt:
          type: string
          format: date-time
      required:
        - userId
        - email
        - role
        - roleInGroup
        - joinedAt
    GroupMemberListResult:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
      required:
        - members
    AddGroupMemberInput:
      type: object
      properties:
        userId:
          type: integer
        roleInGroup:
          $ref: "#/components/schemas/GroupRole"
      required:
        - userId
    UpdateGroupMemberInput:
      type: object
      properties:
        roleInGroup:
          $ref: "#/components/schemas/GroupRole"
      required:
        - roleInGroup
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
    CategoryListResult:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - categories
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
      required:
        - name
    UpdateCategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          nullable: true
    VideoStatus:
      type: string
      enum: [PROCESSING, PENDING_REVIEW, APPROVED, REJECTED, PRIVATE, ARCHIVED, FAILED]
    Video:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/VideoStatus"
        durationSeconds:
          type: number
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        originalFileName:
          type: string
          nullable: true
        storageProvider:
          type: string
          nullable: true
        uploadedBy:
          type: integer
        categoryIds:
          type: array
          items:
            type: integer
        groupIds:
          type: array
          items:
            type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - tags
        - status
        - uploadedBy
        - categoryIds
        - groupIds
        - createdAt
        - updatedAt
    VideoListResult:
      type: object
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        total:
          type: integer
      required:
        - videos
        - total
    CreateVideoInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        categoryIds:
          type: array
          items:
            type: integer
        groupIds:
          type: array
          items:
            type: integer
      required:
        - title
    UpdateVideoInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
          nullable: true
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        categoryIds:
          type: array
          items:
            type: integer
        groupIds:
          type: array
          items:
            type: integer
    ReviewAction:
      type: string
      enum: [APPROVED, REJECTED]
    ReviewInput:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/ReviewAction"
        notes:
          type: string
          maxLength: 2000
      required:
        - action
    ReviewRecord:
      type: object
      properties:
        id:
          type: integer
        videoId:
          type: integer
        reviewerId:
          type: integer
        action:
          $ref: "#/components/schemas/ReviewAction"
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - videoId
        - reviewerId
        - action
        - createdAt
    ReviewListResult:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewRecord"
      required:
        - reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out of the current session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [auth]
      summary: Log out of all sessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: All sessions revoked
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current user and session
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current user and session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResult"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/sessions:
    get:
      operationId: listMySessions
      tags: [auth]
      summary: List active sessions of the current user
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResult"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/sessions/{id}:
    delete:
      operationId: revokeMySession
      tags: [auth]
      summary: Revoke one of the current user's sessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Session revoked
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users (OWNER/ADMIN)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResult"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a user (OWNER/ADMIN; role constraints apply)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (cannot assign this role)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/sessions/{id}:
    delete:
      operationId: adminTerminateSession
      tags: [admin]
      summary: Terminate any session (OWNER only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Session terminated
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user's role or active flag (OWNER/ADMIN; role constraints apply)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deactivateUser
      tags: [admin]
      summary: Deactivate a user (OWNER/ADMIN; role constraints apply)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deactivated
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups visible to the current user
      description: OWNER/ADMIN see all groups; GROUP_MANAGER sees groups they manage; MEMBER sees groups they belong to.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Groups list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResult"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group (OWNER/ADMIN)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Group name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group (members, managers, OWNER/ADMIN)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found or not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group (OWNER/ADMIN)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupInput"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Group name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group (OWNER/ADMIN)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Group deleted
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{id}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List group members (members, managers, OWNER/ADMIN)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberListResult"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found or not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addGroupMember
      tags: [groups]
      summary: Add a member to a group (OWNER/ADMIN, or manager of the group)
      description: Managers can only add members with the "member" group role; assigning "manager" requires OWNER/ADMIN.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:

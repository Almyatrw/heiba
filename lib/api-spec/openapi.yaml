  /stream/{id}:
    get:
      operationId: streamVideo
      tags: [stream]
      summary: Stream a video (HTTP Range supported)
      description: Streams the binary for approved videos visible to the current user. Supports byte-range requests (206) for seeking. The internal storage location is never exposed.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Byte range, e.g. "bytes=0-1048575"
      responses:
        "200":
          description: Full video stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: Partial video stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Video not found, not approved, or not visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          description: Range not satisfiable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
